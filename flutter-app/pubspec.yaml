name: sodexo_flutter_lunch_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  english_words: ^4.0.0
  provider: ^6.1.0
  cupertino_icons: ^1.0.8
  location: ^8.0.0
  font_awesome_flutter: ^10.7.0
  http: ^1.2.2
  intl: ^0.20.2
  shared_preferences: ^2.4.0
  flutter_svg: ^2.0.17
  flutter_native_splash: ^2.4.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

flutter_native_splash:
  color: "#111111"
  image: assets/logo_large.png
  android_12:
    image: assets/logo_large.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.3"
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_foreground_inset: 10
  adaptive_icon_background: "assets/bg.png"
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_monochrome: "assets/logo.png"
